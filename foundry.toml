[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc = "0.8.24"
optimizer = true
optimizer_runs = 200

fs_permissions = [
    { access = "read-write", path = "../backend/deployments" },
    { access = "write", path = "./deployments" }
]


[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
local = "http://127.0.0.1:8545"
